<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐行字符串分拆工具</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="tool-page">

<main class="container">
    <header class="page-header">
        <a class="back-link" href="index.html">← 返回首页</a>
        <h1>逐行字符串分拆工具</h1>
        <p class="description">自定义字符分组与分隔符，实时处理多行文本并保持完整表情。</p>
    </header>
    <div class="panel">
        <div class="input-section">
            <div>
                <label for="chunkSize">每组字符数（1–100）</label>
                <input type="number" id="chunkSize" min="1" max="100" step="1" value="3">
            </div>
            <div>
                <label for="separator">分隔符</label>
                <select id="separator">
                    <option value="space">空格</option>
                    <option value="comma">逗号</option>
                    <option value="hyphen">短横线 -</option>
                    <option value="newline">换行</option>
                    <option value="custom">自定义</option>
                </select>
                <div id="customSeparatorGroup" hidden>
                    <label for="customSeparator">自定义分隔符</label>
                    <input type="text" id="customSeparator" placeholder="可留空">
                </div>
            </div>
        </div>
        <p id="splitStatus" class="inline-error" role="status"></p>
    </div>
    <div class="panel splitter-grid">
    <label for="inputText">输入文本<textarea id="inputText" placeholder="在这里粘贴文本..."></textarea></label>
    <div class="button-container">
        <button onclick="splitText()">分拆</button>
        <button class="secondary" onclick="copyToClipboard()">复制结果</button>
        <button class="secondary" onclick="clearText()">清空</button>
    </div>
    <label for="outputText">分拆结果<textarea id="outputText" placeholder="分拆后的结果会显示在这里..." readonly></textarea></label>
</div>
<p id="stats" role="status">行数：0 / 字符数：0 / 分组数：0</p>
<p class="description">字符数按修剪后的文本计数（不含换行）；支持时按完整字素分组，否则按 Unicode 码点分组。</p>
<p id="copyStatus" role="status"></p>

</main>

<script>
const segmenter = typeof Intl.Segmenter === 'function'
    ? new Intl.Segmenter('zh-CN', { granularity: 'grapheme' })
    : null;

function characters(text) {
    return segmenter ? Array.from(segmenter.segment(text), item => item.segment) : Array.from(text);
}

function splitText() {
    const input = document.getElementById('inputText').value;
    const size = Number(document.getElementById('chunkSize').value);
    const separatorType = document.getElementById('separator').value;
    document.getElementById('customSeparatorGroup').hidden = separatorType !== 'custom';
    document.getElementById('copyStatus').textContent = '';
    const status = document.getElementById('splitStatus');
    const output = document.getElementById('outputText');
    const stats = document.getElementById('stats');
    status.textContent = '';
    if (!Number.isInteger(size) || size < 1 || size > 100) {
        status.textContent = '每组字符数必须是 1–100 之间的整数';
        output.value = '';
        stats.textContent = '行数：— / 字符数：— / 分组数：—';
        return;
    }
    const separators = { space: ' ', comma: ',', hyphen: '-', newline: '\n' };
    const separator = separatorType === 'custom'
        ? document.getElementById('customSeparator').value
        : separators[separatorType];
    const lines = input === '' ? [] : input.split('\n');
    let characterCount = 0;
    let groupCount = 0;
    output.value = lines.map(line => {
        const chars = characters(line.trim());
        characterCount += chars.length;
        const groups = [];
        for (let index = 0; index < chars.length; index += size) {
            groups.push(chars.slice(index, index + size).join(''));
        }
        groupCount += groups.length;
        return groups.join(separator);
    }).join('\n');
    stats.textContent = '行数：' + lines.length + ' / 字符数：' + characterCount + ' / 分组数：' + groupCount;
}

function clearText() {
    document.getElementById('inputText').value = '';
    splitText();
}

for (const id of ['inputText', 'chunkSize', 'customSeparator']) {
    document.getElementById(id).addEventListener('input', splitText);
}
document.getElementById('separator').addEventListener('change', splitText);
splitText();

async function copyToClipboard() {
    const output = document.getElementById('outputText');
    const status = document.getElementById('copyStatus');
    if (!output.value) {
        status.textContent = '没有可复制的结果';
        return;
    }
    try {
        if (!navigator.clipboard) throw new Error('剪贴板不可用');
        await navigator.clipboard.writeText(output.value);
        status.textContent = '分拆结果已复制到剪贴板！';
    } catch (error) {
        output.focus();
        output.select();
        output.setSelectionRange(0, output.value.length);
        status.textContent = '无法自动复制，已选中结果，请按 Ctrl+C 或长按复制。';
    }
}
</script>

</body>
</html>
