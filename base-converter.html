<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换工具</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="tool-page">
    <main class="container">
        <header class="page-header">
            <a class="back-link" href="index.html">← 返回首页</a>
            <h1>进制转换工具</h1>
            <p class="description">支持二进制、八进制、十进制和十六进制之间的相互转换，可批量处理多个数值</p>
        </header>
        
        <div class="input-section">
            <div>
                <div class="form-group">
                    <label for="inputType">输入进制类型</label>
                    <select id="inputType">
                        <option value="2">二进制 (Binary)</option>
                        <option value="8">八进制 (Octal)</option>
                        <option value="10" selected>十进制 (Decimal)</option>
                        <option value="16">十六进制 (Hexadecimal)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="inputValue">输入数值（每行一个）</label>
                    <textarea id="inputValue" placeholder="请输入要转换的数值，每行一个&#10;例如：&#10;255&#10;1024&#10;4096"></textarea>
                </div>
            </div>
            
            <div>
                <div class="form-group">
                    <label for="outputType">输出进制类型</label>
                    <select id="outputType">
                        <option value="2">二进制 (Binary)</option>
                        <option value="8">八进制 (Octal)</option>
                        <option value="10">十进制 (Decimal)</option>
                        <option value="16" selected>十六进制 (Hexadecimal)</option>
                    </select>
                </div>
                
                <div class="buttons">
                    <button class="convert-btn" onclick="convert()">转换</button>
                    <button class="copy-btn" onclick="copyResults()">复制结果</button>
                    <button class="clear-btn" onclick="clearAll()">清空</button>
                </div>
            </div>
        </div>
        
        <div class="result-section">
            <h2>转换结果</h2>
            <div id="results" class="result-grid">
                <div class="result-box">
                    <div class="result-title">等待输入</div>
                    <div class="result-value">请输入数值并点击转换</div>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ul>
                <li>选择输入和输出的进制类型</li>
                <li>在文本框中输入要转换的数值，每行一个</li>
                <li>点击"转换"按钮进行转换</li>
                <li>点击"复制结果"按钮将转换结果复制到剪贴板</li>
                <li>点击"清空"按钮清除所有输入和结果</li>
                <li>十六进制数值可以使用大写或小写字母A-F</li>
            </ul>
        </div>
    </main>
    
    <div class="footer">
        <p>进制转换工具 &copy; 2023</p>
    </div>
    
    <div class="notification" id="notification" role="status">结果已复制到剪贴板！</div>

    <script>
        function convert() {
            const inputType = document.getElementById('inputType').value;
            const outputType = document.getElementById('outputType').value;
            const inputValue = document.getElementById('inputValue').value;
            const resultsContainer = document.getElementById('results');
            
            // 清空之前的结果
            resultsContainer.innerHTML = '';
            
            // 分割输入为多行
            const values = inputValue.split('\n').filter(val => val.trim() !== '');
            
            if (values.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="result-box">
                        <div class="result-title">错误</div>
                        <div class="result-value">请输入有效数值</div>
                    </div>
                `;
                return;
            }
            
            // 转换每个值
            values.forEach((value, index) => {
                value = value.trim();
                
                try {
                    const sign = value.startsWith('-') ? -1n : 1n;
                    let digits = value.replace(/^[+-]/, '');
                    const prefixes = { '2': /^0b/i, '8': /^0o/i, '16': /^0x/i };
                    if (prefixes[inputType]) digits = digits.replace(prefixes[inputType], '');
                    const validDigits = { '2': /^[01]+$/, '8': /^[0-7]+$/, '10': /^[0-9]+$/, '16': /^[0-9a-f]+$/i };
                    if (!validDigits[inputType].test(digits)) throw new Error('无效的输入值或进制数字');
                    const prefix = { '2': '0b', '8': '0o', '10': '', '16': '0x' }[inputType];
                    const decimalValue = sign * BigInt(prefix + digits);
                    const result = decimalValue.toString(Number(outputType)).toUpperCase();
                    appendResult(value, result + ' (' + getBaseName(outputType) + ')');
                } catch (error) {
                    appendResult(value, '转换错误: ' + error.message, true);
                }

            });
        }
        
        function appendResult(value, result, isError = false) {
            const box = document.createElement('div');
            box.className = 'result-box';
            const title = document.createElement('div');
            title.className = 'result-title';
            title.textContent = value + ' (' + getBaseName(document.getElementById('inputType').value) + ')';
            const output = document.createElement('div');
            output.className = 'result-value';
            output.textContent = result;
            if (isError) output.classList.add('inline-error');
            else output.dataset.copy = result;
            box.append(title, output);
            document.getElementById('results').appendChild(box);
        }

        function getBaseName(base) {
            switch(base) {
                case '2': return '二进制';
                case '8': return '八进制';
                case '10': return '十进制';
                case '16': return '十六进制';
                default: return '';
            }
        }
        
        async function copyResults() {
            const results = document.querySelectorAll('.result-value[data-copy]');
            if (results.length === 0) {
                showNotification('没有可复制的结果', true);
                return;
            }
            
            let textToCopy = '';
            results.forEach(result => {
                // 提取纯文本内容（去掉HTML标签）
                textToCopy += result.textContent + '\n';
            });
            
            try {
                if (!navigator.clipboard) throw new Error('当前环境不支持剪贴板，请手动选择结果复制');
                await navigator.clipboard.writeText(textToCopy.trim());
                showNotification('结果已复制到剪贴板！');
            } catch (error) {
                showNotification('复制失败: ' + error.message, true);
            }
        }
        
        function clearAll() {
            document.getElementById('inputValue').value = '';
            document.getElementById('results').innerHTML = `
                <div class="result-box">
                    <div class="result-title">等待输入</div>
                    <div class="result-value">请输入数值并点击转换</div>
                </div>
            `;
        }
        
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.toggle('error', isError);
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // 初始示例值
        document.getElementById('inputValue').value = '255\n1024\n4096';
    </script>
</body>
</html>
